<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Min adressbok</title>
  </head>
  <body class="container-md">
    <header class="d-flex justify-content-center my-3">
      <h1>Min Adressbok</h1>
    </header>
    <main class="my-4">
      <div class= "p-3 mb-4 rounded bg-primary-subtle">
        <h2 class="mb-0 d-flex justify-content-center">Skapa ny kontakt</h2>
      </div>
      <form id="newContactForm" class="bg-primary-subtle my-4 p-4 rounded">
        <div class="mb-3 ">
          <label for="firstName" class="form-label ">Förnamn</label>
          <input type="text" class="form-control" id="firstName" />
        </div>
        <div class="mb-3">
          <label for="lastName" class="form-label">Efternamn</label>
          <input type="text" class="form-control" id="lastName" />
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Telefon-nummer</label>
          <input type="text" class="form-control" id="phone" />
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Adress</label>
          <input type="text" class="form-control" id="address" />
        </div>
        <div class="mb-3">
          <label for="postCode" class="form-label">Postadress</label>
          <input type="text" class="form-control" id="postCode" />
        </div>
        <div class="mb-3">
          <label for="city" class="form-label">Ort</label>
          <input type="text" class="form-control" id="city" />
        </div>
        <label for="category">Kategori</label>
        <select class="rounded " name="category" id="category">
          <option value="family">Familj</option>
          <option value="friends">Vänner</option>
          <option value="work">Arbete</option>
        </select>
        <button type="submit" class="btn btn-primary">Spara</button>
      </form>
    </main>
    <section>
      <ul id="AddressList"></ul>
    </section>

    <div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="feedbackTitle">Meddelande</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="feedbackBody">Feedback-text</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Stäng</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
